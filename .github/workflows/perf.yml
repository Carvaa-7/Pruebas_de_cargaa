name: perf-tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]

jobs:
  k6-perf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Empaquetar el servicio
        run: mvn -B -DskipTests clean package
        working-directory: registraduria

      - name: Levantar el servicio en segundo plano
        run: |
          nohup java -jar target/registraduria-1.0-SNAPSHOT.jar > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Servicio arriba"; exit 0
            fi
            sleep 2
          done
          echo "El servicio no arrancó a tiempo"; cat /tmp/app.log; exit 1
        working-directory: registraduria

      - name: Instalar k6
        run: |
          curl -s https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Preparar carpeta de resultados
        run: mkdir -p perf/results

      # En PRs solo corre baseline (5 min). Los escenarios largos van en
      # workflow_dispatch o ejecución nocturna.
      # NOTA: el script define los escenarios via --env SCENARIO, no con
      # --vus/--duration directos (esos flags entran en conflicto con el
      # bloque 'scenarios' del script y abortan la ejecución).
      - name: Baseline de rendimiento
        run: |
          k6 run \
            --env BASE_URL=http://localhost:8080 \
            --env SCENARIO=baseline \
            perf/scripts/register_person_k6.js

      # Gate de negocio: verifica que el servicio devuelva el resultado
      # correcto (VALID, UNDERAGE, DEAD, etc.), no solo HTTP 200.
      - name: Verificación de resultado de negocio
        run: |
          k6 run \
            --env BASE_URL=http://localhost:8080 \
            --env SCENARIO=baseline \
            --env ID_BASE=700000000 \
            perf/scripts/register_voter_k6.js

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: perf/results/summary-*.json
          if-no-files-found: warn
